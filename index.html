    <div class="textbox story-box">
      <p>啵啵在大城市拼命加班，再睁眼时已经躺在医院里。他辞了职，坐上了回家乡木薯镇的车。</p><p>刚下车，就被一辆三蹦子吓得摔了一跤。骑车的，是多年没见的发小恒星。恒星的爷爷留下一家开了几十年的奶茶店，地板一踩就裂，账上早就入不敷出，谁都劝他放手。</p><p>啵啵留了下来。</p>
    </div>

      <li class="card textbox" data-card="diy_drink" data-order="0"><div class="clip" data-clip="03_diy_drink_zh" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">亲手调一杯</h3><p>奶茶、奶盖茶、鲜果茶、咖啡，50 多款配方。加什么料、加多少，都靠你自己的手。</p></li><li class="card textbox" data-card="shop_service" data-order="1"><div class="clip" data-clip="04_shop_service_all" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">开门迎客</h3><p>外带的客人赶时间，堂食的客人挑环境。摆好桌椅，雇上镇里的熟面孔，让避雨巷重新热闹起来。</p></li><li class="card textbox" data-card="combat" data-order="2"><div class="clip" data-clip="05_combat_zh" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">一睡着就掉进梦里</h3><p>打印机、摄像头、盖章先生，啵啵怕过的东西都在梦里等着。拿珍珠、红豆和茶当弹药打回去，顺手带点原料回来。今晚不想打？点亮台灯，一觉睡到天亮。</p></li><li class="card textbox" data-card="fishing" data-order="3"><div class="clip" data-clip="07_fishing_zh" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">踩着节拍钓鱼</h3><p>每条鱼都是曲子里的一个声部。钓上鱼王的时候，整首歌才会完整响起来。</p></li><li class="card textbox" data-card="farm_sprinklers" data-order="4"><div class="clip clip-px" data-clip="06_farm_sprinklers_all" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="960" height="540"></video></div><h3 class="f-head">田里种的，杯里喝的</h3><p>春、夏、秋三季，31 种作物。收成磨一磨、煮一煮，就是明天店里的小料。</p></li><li class="card textbox" data-card="quest_birthday" data-order="5"><div class="clip" data-clip="08_quest_birthday_zh" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">镇上的日子</h3><p>18 位居民各过各的日子。记住他们爱收什么礼物，也别忘了生日。</p></li>
    </ul>

    <div class="textbox story-box">
      <p>Bobo worked himself into a hospital bed in the big city. He quit his job and caught the bus back to his hometown, Tapioca Town.</p><p>He&#x27;s barely off the bus when a tricycle sends him sprawling. The rider is Stellar, a childhood friend he hasn&#x27;t seen in years. Stellar&#x27;s grandpa left him a decades-old milk tea shop with cracking floorboards and books deep in the red. Everyone tells him to let it go.</p><p>So Bobo stays.</p>

    <h2 id="play-h" class="sr-only">What you do</h2>
    <ul class="cards" id="cards">
      <li class="card textbox" data-card="diy_drink" data-order="0"><div class="clip" data-clip="03_diy_drink_en" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">Mix it yourself</h3><p>Milk teas, foam teas, fruit teas, coffees. Over 50 recipes, and every cup is made by your own hands.</p></li><li class="card textbox" data-card="shop_service" data-order="1"><div class="clip" data-clip="04_shop_service_all" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">Open the doors</h3><p>Takeout customers are in a hurry. Dine-in guests care how the place looks. Set the tables, hire familiar faces from town, and bring Sheltered Lane back to life.</p></li><li class="card textbox" data-card="combat" data-order="2"><div class="clip" data-clip="05_combat_en" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">Fall asleep, fall into a dream</h3><p>Printers, security cameras, Mr. Stamp. Everything Bobo used to dread is waiting in Dreamland. Fire pearls, red beans, and tea right back at them, and bring home ingredients. Not tonight? Switch on the lamp and sleep till morning.</p></li><li class="card textbox" data-card="fishing" data-order="3"><div class="clip" data-clip="07_fishing_en" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">Fish to the beat</h3><p>Every fish is one part of a song. Hook a Fish King and the whole band plays.</p></li><li class="card textbox" data-card="farm_sprinklers" data-order="4"><div class="clip clip-px" data-clip="06_farm_sprinklers_all" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="960" height="540"></video></div><h3 class="f-head">From the field to the cup</h3><p>31 crops across spring, summer, and fall. Grind and simmer your harvest into tomorrow&#x27;s toppings.</p></li><li class="card textbox" data-card="quest_birthday" data-order="5"><div class="clip" data-clip="08_quest_birthday_en" ><video muted loop playsinline preload="none" aria-hidden="true" tabindex="-1" width="1280" height="720"></video></div><h3 class="f-head">Life in town</h3><p>18 townsfolk keep their own routines. Learn their favorite gifts, and don&#x27;t forget their birthdays.</p></li>
    </ul>
  </section>

        <h2 id="status-h" class="f-head">Where we&#x27;re at</h2>
        <p>Call of Boba is in Early Access on Steam, and it isn&#x27;t finished. The main story hasn&#x27;t reached its ending, and there&#x27;s no romance or festivals yet.</p><p>We&#x27;re Tomatoast, a core team of four. With so few hands, our pace is uneven. Every update is written up in our Steam news.</p>
